function animateBalanceValue(el,target){
  if(!el||!Number.isFinite(target)||isReducedMotion())return;
  const isInt=Number.isInteger(target),from=isInt?Math.round(target*0.72):target*0.72,start=performance.now(),dur=320;
  const fmt=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:isInt?0:3});
  const tick=now=>{
    if(!el.isConnected)return;
    const t=Math.min(1,(now-start)/dur),e=1-Math.pow(1-t,3);
    const val=from+(target-from)*e;
    const raw=fmt.format(isInt?Math.round(val):val);
    const p=raw.split(/([,.]\d+)$/);
    el.innerHTML=esc(p[0])+(p[1]?`<span class="tg-card-dec">${esc(p[1])}</span>`:'');
    if(t<1)requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

async function selectCurrency(asset){
  if(!['coins','energy'].includes(asset)||asset===state.currency)return;
  const prev=state.currency;
  state.currency=asset;
  haptic();
  document.querySelectorAll('.tg-seg [data-currency]').forEach(b=>{const on=b.dataset.currency===asset;b.classList.toggle('is-active',on);b.setAttribute('aria-pressed',String(on));const seg=b.closest('.tg-seg');if(seg)seg.style.setProperty('--seg-idx',asset==='energy'?'1':'0')});
  const wrap=document.getElementById('tg-wallet-hero-wrap');
  if(wrap){
    wrap.outerHTML=walletCardSection();
    const card=document.getElementById('tg-wallet-hero');
    if(card&&!isReducedMotion()){
      const swapCls=asset==='energy'&&prev==='coins'?'swap-right':'swap-left';
      card.classList.add('is-swapping',swapCls);
      card.addEventListener('animationend',()=>card.classList.remove('is-swapping',swapCls),{once:true});
      animateBalanceValue(card.querySelector('.tg-card-num'),Number(state.data.wallet[asset==='energy'?'energy':'coins'])||0);
    }
  }
  paintWalletHistory();
  await loadWalletHistory();
}

let navDir='fade';
function animateStatNumbers(){
  if(isReducedMotion())return;
  document.querySelectorAll('.stat-number').forEach(el=>{
    const raw=el.textContent.trim();
    if(!/^\d+$/.test(raw))return;
    const target=Number(raw);
    if(!target)return;
    const start=performance.now(),dur=380;
    const tick=now=>{
      if(!el.isConnected)return;
      const t=Math.min(1,(now-start)/dur),e=1-Math.pow(1-t,3);
      el.textContent=String(Math.round(target*e));
      if(t<1)requestAnimationFrame(tick);else el.textContent=raw;
    };
    requestAnimationFrame(tick);
  });
}

let historyBusy=false;
async function loadWalletHistory(){
  const asset=state.currency,group=state.group;
  if(state.walletHistory[asset]||historyBusy)return;
  historyBusy=true;
  try{
    const now=Date.now()/1000;
    const demoItems=asset==='energy'
      ?[
        {id:105,title:'Работа',amount:5,asset:'energy',created:now-420},
        {id:104,title:'Покупка в магазине',amount:-18,asset:'energy',created:now-5400},
        {id:103,title:'Пополнение молний',amount:40,asset:'energy',created:now-28800},
        {id:102,title:'Продление доступа',amount:-25,asset:'energy',created:now-96000},
        {id:101,title:'Перевод',amount:15,asset:'energy',created:now-180000}
      ]
      :[
        {id:5,title:'Работа',amount:145,asset:'coins',created:now-300},
        {id:4,title:'Покупка фермы',amount:-1200,asset:'coins',created:now-3000},
        {id:3,title:'Перевод получен',amount:500,asset:'coins',created:now-24000},
        {id:2,title:'Покупка товара',amount:-350,asset:'coins',created:now-72000},
        {id:1,title:'Работа',amount:120,asset:'coins',created:now-140000}
      ];
    const result=state.demo?{items:demoItems,next:null}:await request('/groups/'+group+'/history',{method:'POST',body:JSON.stringify({asset})});
    if(state.group!==group)return;
    state.walletHistory[asset]=result;
    if(state.view==='wallet'&&state.currency===asset)paintWalletHistory();
  }catch(error){if(state.group===group)toast(error.message)}
  finally{historyBusy=false;if(state.view==='wallet'&&!state.walletHistory[state.currency]&&state.currency!==asset)loadWalletHistory()}
}

async function showWalletHistory(){
  await loadWalletHistory();
  const rows=state.walletHistory[state.currency];
  const visible=rows?filterWalletItems(rows.items):[];
  sheet('История · '+(state.currency==='coins'?'C₲':'⚡'),`<div id="all-history" class="card tg-group has-badges">${visible.length?historyRows(visible):empty('Операций пока нет.','wallet')}</div>${rows?.next?btn('Ещё операции','history-more','','wide secondary'):''}`);
}

async function moreWalletHistory(){
  const asset=state.currency,group=state.group,rows=state.walletHistory[asset];
  if(!rows?.next)return;
  const result=await request('/groups/'+group+'/history',{method:'POST',body:JSON.stringify({asset,before:rows.next})});
  if(state.group!==group||state.currency!==asset)return;
  rows.items.push(...result.items);rows.next=result.next;
  await showWalletHistory();
}

function panelText(text,entities=[]){const safe=new Set(['bold','italic','underline','strikethrough','code','pre','spoiler']);const tags={bold:'b',italic:'i',underline:'u',strikethrough:'s',code:'code',pre:'pre',spoiler:'span'};const points=new Map();for(const e of entities){if(!safe.has(e.type)||!Number.isInteger(e.offset)||!Number.isInteger(e.length)||e.offset<0||e.length<=0||e.offset+e.length>text.length)continue;const end=e.offset+e.length;if(!points.has(e.offset))points.set(e.offset,[]);if(!points.has(end))points.set(end,[]);points.get(e.offset).push({tag:tags[e.type],start:true,end});points.get(end).push({tag:tags[e.type],start:false,end:e.offset})}let result='';for(let i=0;i<=text.length;i++){const events=points.get(i)||[];for(const e of events.filter(e=>!e.start).sort((a,b)=>b.end-a.end))result+='</'+e.tag+'>';for(const e of events.filter(e=>e.start).sort((a,b)=>b.end-a.end))result+='<'+e.tag+'>';if(i<text.length)result+=esc(text[i])}return result}

function topupPrice(value){const n=Number(value),valid=String(value).trim()!==''&&Number.isSafeInteger(n)&&n>=2&&n<=1000000;const rate=n>=1500?3:n>=250?4:5;return {n,valid,rate,total:n*rate}}
function updateTopupPrice(){const input=document.getElementById('panel-value');if(!input||!document.getElementById('topup-total'))return;const p=topupPrice(input.value),button=document.querySelector('#panel-input-form [type=submit]');document.getElementById('topup-total').textContent=p.valid?money(p.total)+' ⭐':'—';document.getElementById('topup-validation').textContent=p.valid?'':'Введите целое количество от 2 до 1 000 000';button.disabled=!p.valid;button.textContent=p.valid?'Оплатить':'Укажите количество';document.querySelectorAll('[data-topup-amount]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.topupAmount)===p.n)));document.querySelectorAll('[data-topup-rate]').forEach(el=>el.classList.toggle('selected',p.valid&&Number(el.dataset.topupRate)===p.rate))}
function drawTopup(p){state.panel=p;const amount=state.topupAmount||'250';if(p.form){sheet('Пополнить ⚡',`<p class="topup-caption">На общий баланс для всех групп</p><form id="panel-input-form" class="topup-form" data-token="${esc(p.form.token)}">${p.topupError?`<p class="topup-error" role="alert">${esc(p.topupError)}</p>`:''}<label class="field-label" for="panel-value">Количество молний</label><div class="topup-quantity"><input id="panel-value" type="number" inputmode="numeric" min="2" max="1000000" step="1" value="${esc(amount)}" required aria-describedby="topup-validation"><span aria-hidden="true">⚡</span></div><div class="topup-presets">${[10,250,1500].map(n=>`<button type="button" data-topup-amount="${n}">${money(n)} ⚡</button>`).join('')}</div><div class="topup-hint">От 2 ⚡ · только целое количество</div><div class="topup-price"><span>К оплате</span><strong id="topup-total"></strong></div><div class="topup-error" id="topup-validation" aria-live="polite"></div><button type="submit" class="btn primary wide"></button><p class="topup-footnote">Молнии начислятся после оплаты</p></form>`);updateTopupPrice();return}sheet('Пополнение ⚡',`<div class="panel-body">${esc(p.invoice?'Завершите оплату в окне Telegram.':p.text)}</div><div class="dialog-actions">${btn('Другая сумма','panel','topup','secondary')}${btn('Закрыть','close-dialog','','secondary')}</div>`);if(p.invoice){if(tg?.openInvoice)tg.openInvoice(p.invoice,status=>{if(status==='paid'){closeDialog();toast('Оплата прошла. Обновляем баланс.');refreshAfterPanel()}else if(['cancelled','failed'].includes(status))openPanel('topup').catch(e=>toast(e.message))});else toast('Оплата доступна внутри Telegram.')}}

ame)}</strong><small>${esc(b.item.detail)}</small></span><span>${money(b.item.price)} ${assetSymbol(b.item.asset)}</span></button>`).join('')}</div>`:`<div class="store-page-text">${panelText(p.text,p.entities)}</div>`)+`<div class="panel-buttons">${other.map(b=>btn(b.label,b.token?'panel-step':'panel-url',b.token||b.url,'secondary wide')).join('')}</div>`}sheet('Магазин',tabs+(balance?`<div class="store-balance">Ваш баланс: ${balance}</div>`:'')+content+`<div class="store-footer">${p.back?btn('Назад','panel-step',p.back,'secondary'):''}${btn('Закрыть','close-dialog','','secondary')}</div>`)}

ton class="btn secondary" type="button" data-action="close-dialog">Отмена</button><button class="btn primary" type="submit">Сохранить</button></div><p id="ai-pref-error" class="commerce-error" role="alert" hidden></p></form>`)}

function drawPanel(p){
  if(p.form?.kind==='stars_donation')p.section='donate';
  if(p.section==='donate')return drawDonation(p);
  if(p.receipt)return commerceReceipt(p);
  if(p.checkout)return commerceCheckout(p);
  if(subscriptionView(p))return;
  if(p.form&&['transfer','exchange'].includes(p.form.kind))return commerceForm(p,p.form.kind);
  if(p.form?.kind==='energy_topup')p.section='topup';
  if(p.section==='topup')return drawTopup(p);
  if(p.section==='shop'&&!p.form)return shopView(p);
  state.panel=p;
  sheet('Управление',`${p.photo&&p.photo.startsWith('data:image/png;base64,')?`<img class="map-image" src="${p.photo}" alt="График цены доли">`:''}${panelIntro(p)}${p.map&&vip()?'<div data-village-map id="map-container"></div>':''}<div class="panel-buttons">${p.buttons.map(row=>`<div class="panel-button-row">${row.map(b=>b.token?btn(b.label,'panel-step',b.token,'secondary'):`<button class="btn secondary" data-action="panel-url" data-arg="${esc(b.url)}">${esc(b.label)}</button>`).join('')}</div>`).join('')}</div>${p.form?`<form class="panel-form" id="panel-input-form" data-token="${esc(p.form.token)}"><label class="field-label" for="panel-value">${esc(p.form.label)}</label>${p.form.secret?'<input id="panel-value" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" maxlength="8000" required>':'<textarea id="panel-value" maxlength="8000" required placeholder="Введите ответ"></textarea>'}<button class="btn primary wide" type="submit">Продолжить</button></form>`:''}`);
  if(p.map)loadMap();
  if(p.invoice){if(tg?.openInvoice)tg.openInvoice(p.invoice,()=>refreshAfterPanel());else toast('Оплата доступна внутри Telegram.')}
}

/* Power-saving mode, UI design switcher, and <20 FPS auto-prompt */
let lagPromptDismissedSession=false;
let lagPromptOpen=false;
let fpsRaf=0;
let fpsGraceTimer=null;

function isPowerSaveOn(){
  if(document.documentElement.classList.contains('tg-power-save'))return true;
  try{return localStorage.getItem('golka.powerSave')==='1'}catch{return false}
}
function isReducedMotion(){
  return isPowerSaveOn()||Boolean(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches);
}
function isLagPromptNever(){
  try{return localStorage.getItem('golka.lagPromptNever')==='1'}catch{return false}
}
function closeLagPrompt(){
  const d=document.getElementById('tg-lag-prompt');
  if(d?.open)d.close();
  lagPromptOpen=false;
}
function setPowerSave(enabled,silent=false){
  const on=Boolean(enabled);
  document.documentElement.classList.toggle('tg-power-save',on);
  try{localStorage.setItem('golka.powerSave',on?'1':'0')}catch{}
  const hero=document.getElementById('tg-wallet-hero');
  if(on&&hero){hero.style.removeProperty('--rx');hero.style.removeProperty('--ry');hero.style.removeProperty('--mx');hero.style.removeProperty('--my')}
  document.querySelectorAll('[data-ui-pref="power-save"]').forEach(b=>b.setAttribute('aria-checked',String(on)));
  if(on){
    stopFpsMonitor();
    closeLagPrompt();
  }else{
    scheduleFpsMonitor(1500);
  }
  if(!silent)toast(on?'Режим энергосбережения включён':'Режим энергосбережения выключен');
}
function switchToLegacy(){
  try{localStorage.setItem('golka.uiDesign','legacy')}catch{}
  const u=new URL('legacy.html',location.href);
  u.search=location.search;
  u.hash=location.hash;
  const sp=new URLSearchParams(u.search);
  if(sp.get('design')==='tg'){sp.delete('design');u.search=sp.toString()?'?'+sp.toString():''}
  location.replace(u.href);
}
function showLagPrompt(){
  if(isPowerSaveOn()||lagPromptDismissedSession||isLagPromptNever()||lagPromptOpen)return;
  const d=document.getElementById('tg-lag-prompt');
  if(!d)return;
  stopFpsMonitor();
  lagPromptOpen=true;
  if(!d.open)d.showModal();
}
function stopFpsMonitor(){
  if(fpsGraceTimer){clearTimeout(fpsGraceTimer);fpsGraceTimer=null}
  if(fpsRaf){cancelAnimationFrame(fpsRaf);fpsRaf=0}
}
function startFpsMonitor(){
  if(fpsRaf||isPowerSaveOn()||lagPromptDismissedSession||isLagPromptNever()||lagPromptOpen||document.hidden)return;
  let winStart=performance.now();
  let lastFrame=winStart;
  let frames=0;
  let lowStreak=0;
  const tick=now=>{
    fpsRaf=0;
    if(isPowerSaveOn()||lagPromptDismissedSession||isLagPromptNever()||lagPromptOpen||document.hidden)return;
    const dt=now-lastFrame;
    lastFrame=now;
    if(dt>1000){
      winStart=now;
      frames=0;
      lowStreak=0;
    }else{
      frames++;
      const elapsed=now-winStart;
      if(elapsed>=1000){
        const fps=(frames*1000)/elapsed;
        if(fps<20){
          lowStreak++;
          if(lowStreak>=2){
            showLagPrompt();
            return;
          }
        }else{
          lowStreak=0;
        }
        winStart=now;
        frames=0;
      }
    }
    fpsRaf=requestAnimationFrame(tick);
  };
  fpsRaf=requestAnimationFrame(tick);
}
function scheduleFpsMonitor(delay=2500){
  stopFpsMonitor();
  if(isPowerSaveOn()||lagPromptDismissedSession||isLagPromptNever()||lagPromptOpen||document.hidden)return;
  fpsGraceTimer=setTimeout(()=>{fpsGraceTimer=null;startFpsMonitor()},delay);
}
window.__tgShowLagPrompt=showLagPrompt;

document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stopFpsMonitor()}
  else{scheduleFpsMonitor(1000)}
});
document.addEventListener('click',e=>{
  const pref=e.target.closest('[data-ui-pref]');
  if(pref&&!pref.disabled){
    e.stopImmediatePropagation();
    const kind=pref.dataset.uiPref;
    if(kind==='power-save'){setPowerSave(pref.getAttribute('aria-checked')!=='true')}
    else if(kind==='legacy-design'){switchToLegacy()}
    return;
  }
  const lb=e.target.closest('[data-lag-action]');
  if(!lb)return;
  const act=lb.dataset.lagAction;
  if(act==='disable'){
    setPowerSave(true);
  }else if(act==='keep'){
    lagPromptDismissedSession=true;
    closeLagPrompt();
    toast('Анимации оставлены до закрытия приложения');
  }else if(act==='never'){
    lagPromptDismissedSession=true;
    try{localStorage.setItem('golka.lagPromptNever','1')}catch{}
    closeLagPrompt();
    toast('Окно больше не будет показываться');
  }
},true);
document.getElementById('tg-lag-prompt')?.addEventListener('cancel',e=>{
  e.preventDefault();
  lagPromptDismissedSession=true;
  closeLagPrompt();
});
scheduleFpsMonitor(2500);
if(new URLSearchParams(location.search).get('testlag')==='1'){
  setTimeout(()=>{showLagPrompt()},600);
}
