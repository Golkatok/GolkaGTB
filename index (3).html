<nav class="bottom-nav" aria-label="Основная навигация"><button class="nav-item active" data-view="home"><svg class="icon"><use href="#i-home"/></svg>Главная</button><button class="nav-item" data-view="wallet"><svg class="icon"><use href="#i-wallet"/></svg>Кошелёк</button><button class="nav-item" data-view="events"><svg class="icon"><use href="#i-calendar"/></svg>События</button><button class="nav-item" data-view="profile"><svg class="icon"><use href="#i-user"/></svg>Профиль</button></nav>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button class="icon-btn" data-action="close-dialog" aria-label="Закрыть"><svg class="icon"><use href="#i-close"/></svg></button></div><div id="dialog-body"></div></dialog><div id="toast" class="toast" role="status"></div>
<script>
'use strict';
// Публичный адрес API бота. Здесь никогда не должно быть токенов или API-ключей.
const API_BASE = 'https://golka-gtb-api.j.onjrnm.co.uk';
const FALLBACK_BOT = 'GolMod_bot';
const tg=window.Telegram?.WebApp;
const auth=tg?.initData||'';
const state={demo:!auth,user:null,groups:[],group:null,data:null,view:'home',history:[],bot:FALLBACK_BOT,loading:false,mapURL:null};
const main=document.getElementById('main');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<svg class="icon" aria-hidden="true"><use href="#i-${esc(n)}"/></svg>`;
const money=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:3}).format(Number(n)||0);
const duration=s=>{s=Math.max(0,Math.ceil(s));return s?[(s>=3600?Math.floor(s/3600)+'ч':''),(s>=60?Math.floor(s%3600/60)+'м':''),(s%60+'с')].filter(Boolean).join(' '):'Доступно сейчас'};
const fmtDate=v=>new Date(v*1000).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const role=r=>({owner:'владелец бота',manager:'управляющий',member:'участник'}[r]||'участник');
const tier=g=>g.paid?({vip:'VIP',vipplus:'VIP+',standard:'Полный доступ'}[g.tier]||'Полный доступ'):'Бесплатный';
const vip=()=>!!state.data?.group.paid&&['vip','vipplus'].includes(state.data.group.tier);
const manager=()=>state.data?.group.role!=='member';
const heading=(title,i)=>`<div class="page-title">${icon(i)}<h2>${esc(title)}</h2></div>`;
const empty=(text,i='chat')=>`<div class="empty">${icon(i)}${esc(text)}</div>`;
const btn=(label,action,arg='',kind='')=>`<button class="btn ${kind}" data-action="${esc(action)}" data-arg="${esc(arg)}">${esc(label)}</button>`;
const LABELS={moderation_enabled:['Вся модерация','ИИ и встроенные проверки сообщений'],ai_moderation_enabled:['ИИ-модерация','Проверка по вашим правилам и категориям'],spam_enabled:['Антиспам','Одинаковые сообщения и обходы символами'],flood_enabled:['Антифлуд','Слишком частые сообщения участников'],delete_notifications:['Уведомления об удалении','Сообщать в группе о сработавшей проверке'],ai_chat_search:['Поиск в интернете','Использовать веб-поиск в ответах ИИ']};
const FEATURE_LABELS={'section.games':'Все игры','section.rp':'Ролевые команды',work:'Работа',study:'Обучение',deposit:'Депозит',slots:'Слоты DpC',dice:'Кубики',basketball:'Баскетбол',bowling:'Кегли',giveaway:'Розыгрыши',village:'Посёлок',ai:'Команда чата с ИИ',shop:'Магазин',market:'Маркет ферм',farms:'Автофермы',investments:'Инвестиции'};
let toastTimer;
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3400)}
function sheet(title,html){document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-body').innerHTML=html;const d=document.getElementById('dialog');if(!d.open)d.showModal()}
function closeDialog(){document.getElementById('dialog').close()}
function haptic(){try{tg?.HapticFeedback?.impactOccurred('light')}catch{}}
async function request(path,options={}){
 if(!API_BASE||API_BASE==='__API_BASE__')throw new Error('Сервер ещё не подключён. Обратитесь к владельцу бота.');
 const response=await fetch(API_BASE.replace(/\/$/,'')+'/miniapp/v1'+path,{...options,headers:{'Authorization':'tma '+auth,...(options.body?{'Content-Type':'application/json'}:{}),...options.headers},signal:AbortSignal.timeout(18000),credentials:'omit',cache:'no-store'});
 if(!response.ok){let error;try{error=await response.json()}catch{}throw new Error(error?.retry_after?'Следующая попытка через '+duration(error.retry_after):error?.error||'Сервер недоступен. Попробуйте позже.')}
 return response.json();
}
function status(){const g=state.data.group;return `<div class="statusbar" ${g.enabled?'':'style="color:var(--yellow)"'}><span><span class="statusdot"></span>${g.enabled?'Бот работает':'Бот приостановлен'}</span><span class="tier ${g.paid?'':'free'}">${esc(tier(g))}</span></div>`}
function villagePreview(){if(!vip())return '';const v=state.data.village;const percent=v?Math.max(0,Math.min(100,100*(v.xp-v.level_start)/Math.max(1,v.next_xp-v.level_start))):0;return `<section class="village-hero map-hero"><div class="village-cover" data-village-map>${v?.has_map?'<div class="map-placeholder">Загружаем карту…</div>':'<div class="map-placeholder">'+icon('village')+'<span>Карта посёлка ещё не создана</span></div>'}</div><div class="village-summary"><h2>Наш посёлок</h2><div class="village-level">${v?'Уровень <b>'+esc(v.level)+'</b>':'VIP'}</div>${v?`<div class="progress"><i style="width:${percent}%"></i></div><span class="caption">${money(v.xp)} / ${money(v.next_xp)} XP</span>`:'<p class="caption">Создайте свой посёлок вместе с участниками группы.</p>'}<div style="margin-top:14px">${btn(v?'Открыть →':'Создать →','navigate','village')}</div></div></section>`}
function home(){const d=state.data,s=d.stats;const features=[['moderation','shield','Модерация','Защита, фильтры и правила'],['settings','settings','Настройки','Функции и уведомления'],['economy','wallet','Экономика','Магазин, работа, фермы'],['ai','ai','Чат с ИИ','Модели, промпт и лимиты'],['giveaways','gift','Розыгрыши','Призы и события группы'],['village','village','Посёлок','Карта, здания и развитие']].filter(f=>f[0]!=='village'||vip());return status()+`<div class="heading"><h2>Обзор группы</h2><span class="role">Ваша роль:<br><b>${esc(role(d.group.role))}</b></span></div><div class="card"><div class="caption">За сегодня · UTC</div><div class="stats">${[['chat',s.checked,'Проверено'],['trash',s.removed,'Срабатываний'],['users',s.members??'—','Участников']].map(([i,n,l])=>`<div class="stat">${icon(i)}<div class="stat-number">${esc(n)}</div><div class="stat-label">${l}</div></div>`).join('')}</div></div><div class="feature-grid">${features.map(([view,i,t,sub])=>`<button class="feature-card" data-view="${view}"><span class="feature-icon">${icon(i)}</span><span class="feature-arrow">›</span><strong>${t}</strong><small>${sub}</small></button>`).join('')}</div>${villagePreview()}<div class="connected-label">${state.demo?'Демонстрационные данные':'Синхронизировано с ботом'} · Golka GTB ${esc(d.version)}</div>`}
function toggle(key,features=false){const on=features?state.data.features[key]:state.data.settings[key];const [title,sub]=features?[FEATURE_LABELS[key]||key,'Включить для участников группы']:LABELS[key];return `<div class="row"><div class="row-body"><strong>${esc(title)}</strong><small>${esc(sub)}</small></div><button class="switch" role="switch" aria-label="${esc(title)}" aria-checked="${!!on}" data-toggle="${esc(key)}" data-feature="${features?'1':'0'}" ${manager()?'':'disabled'}></button></div>`}
function moderation(){const d=state.data;if(!manager())return heading('Модерация','shield')+empty('Изменять модерацию могут владелец доступа и назначенные управляющие.','shield');return heading('Модерация','shield')+(!d.group.paid?'<div class="note warning">Бесплатный тариф: доступны встроенные проверки. ИИ-модерация и общая база знаний подключаются с полным доступом.</div>':'')+`<div class="card">${['moderation_enabled','ai_moderation_enabled','spam_enabled','flood_enabled'].map(k=>toggle(k)).join('')}</div><div class="card"><div class="row"><div class="row-body"><strong>Режим ИИ Модерации</strong><small>${{dry:'Тест: сообщения остаются в чате',delete:'Удаление нарушений',enforce:'Удаление и настроенные наказания'}[d.settings.mode]||'Не выбран'}</small></div>${btn('Изменить','mode')}</div><div class="row"><div class="row-body"><strong>Правила для ИИ</strong><small>По ним бот оценивает сообщения</small></div>${btn('Изменить','edit','rules')}</div></div>${btn('Категории и действия в боте','bot','moderation','wide secondary')}`}
function wallet(){const w=state.data.wallet;const progress=Math.max(0,Math.min(100,(w.xp-w.level_start)/(w.next_xp-w.level_start)*100));return heading('Кошелёк','wallet')+`<div class="card wallet-hero"><div class="caption">Баланс в этой группе</div><div class="wallet-total">${money(w.coins)} <span>C₲</span></div><div class="wallet-secondary">${icon('bolt')}${money(w.energy)} ⚡ <span class="caption">на все группы</span></div><div class="wallet-actions">${btn('Перевести','bot','transfer','primary')}${btn('Магазин','bot','shop','secondary')}</div></div><div class="two-col"><div class="mini-card">${icon('book')}<div class="caption">Обучение</div><div class="big">${w.education}<span class="caption"> / 500</span></div></div><div class="mini-card">${icon('ai')}<div class="caption">Уровень</div><div class="big">${w.level}</div></div></div><div class="card" style="margin-top:16px"><div class="row"><div class="row-body"><strong>Прогресс уровня</strong><small>${money(w.xp)} / ${money(w.next_xp)} XP</small></div><span class="chip">×${w.rebirths+1} прибыль</span></div><div class="progress"><i style="width:${progress}%"></i></div></div><div class="card"><div class="row"><span class="event-mark">${icon('work')}</span><div class="row-body"><strong>Работа</strong><small>${duration(w.work_remaining)}</small></div><button class="btn" data-daily="work" ${w.work_remaining?'disabled':''}>Работать</button></div><div class="row"><span class="event-mark">${icon('book')}</span><div class="row-body"><strong>Обучение</strong><small>${duration(w.study_remaining)}</small></div><button class="btn" data-daily="study" ${w.study_remaining?'disabled':''}>Учиться</button></div></div>`}
function settings(){return heading('Настройки','settings')+(manager()?`<div class="card">${toggle('delete_notifications')}</div><div class="section-label">Функции группы</div><div class="card">${Object.keys(state.data.features).map(k=>toggle(k,true)).join('')}</div>${btn('Управляющие и права в боте','bot','manage','wide secondary')}`:empty('Настройки доступны управляющим группы.','shield'))}
function ai(){const d=state.data,p=Math.max(0,Math.min(100,d.ai.remaining_percent));return heading('Чат с ИИ','ai')+`<div class="card"><div class="row"><div class="row-body"><strong>DeepSeek Flash + Pro</strong><small>Единый месячный лимит для двух моделей</small></div><span class="chip ${d.ai.active?'on':''}">${d.ai.active?'Активна':'Нет подписки'}</span></div><div class="big">${p}% <span class="caption">лимита осталось</span></div><div class="progress"><i style="width:${p}%"></i></div><div class="caption">Учитываются сообщения, история и ответы.</div></div>${manager()?`<div class="card"><div class="row"><div class="row-body"><strong>Модель по умолчанию</strong><small>${esc({off:'Выключено',flash:'DeepSeek Flash',pro:'DeepSeek Pro',connection:'Свой API',gpt:'GPT Luna'}[d.ai.source]||'Не выбрана')}</small></div>${btn('Выбрать','ai-model')}</div><div class="row"><div class="row-body"><strong>Свой промпт</strong><small>Характер и задачи вашего помощника</small></div>${btn('Изменить','edit','ai_chat_prompt')}</div>${toggle('ai_chat_search')}</div>`:''}<div class="two-col">${btn('Подписка','bot','ai','primary')}${btn('Свой API','bot','aiconnections','secondary')}</div><div class="note">Обратиться к ИИ в группе: /ai ваш вопрос. Можно ответить на сообщение помощника.</div>`}
function economy(){return heading('Экономика','wallet')+`<div class="feature-grid">${[['wallet','wallet','Кошелёк','Баланс, работа и обучение'],['shop','wallet','Магазин','Товары и улучшения'],['market','village','Маркет ферм','Покупка и продажа'],['farms','work','Автофермы','Ваш ежедневный доход'],['investments','ai','Инвестиции','Компании и доли'],['games','gift','Игры','Кубики, деп и слоты']].map(([key,i,t,sub])=>`<button class="feature-card" ${key==='wallet'?'data-view="wallet"':`data-action="bot" data-arg="${key}"`}><span class="feature-icon">${icon(i)}</span><strong>${t}</strong><small>${sub}</small></button>`).join('')}</div><div class="note">C₲ и обучение отдельные для каждой группы. Баланс ⚡ общий.</div>`}
function village(){if(!vip())return heading('Посёлок','village')+empty('Посёлки доступны для групп VIP и VIP+.','village');const v=state.data.village;return heading('Посёлок','village')+(v?`<div class="card"><h3>Уровень ${v.level}</h3><div class="caption">${money(v.xp)} / ${money(v.next_xp)} XP</div><div class="progress"><i style="width:${Math.max(0,Math.min(100,100*(v.xp-v.level_start)/(v.next_xp-v.level_start)))}%"></i></div><p class="text-content">${esc(v.description)}</p><div class="chips"><span class="chip on">${v.available} доступных улучшений</span><span class="chip">Опыт за активность группы</span></div><div id="map-container" data-village-map>${v.has_map?'<div class="loading" style="min-height:100px">Загружаем карту…</div>':empty('Карта ещё не создана.','village')}</div>${btn('Строительство в боте','bot','village','wide primary')}</div><div class="section-label">Постройки</div><div class="card">${v.buildings.length?v.buildings.map(b=>`<div class="row"><span class="event-mark">${icon('village')}</span><div class="row-body"><strong>${esc(b.name)}</strong><small>Уровень ${b.level}</small></div></div>`).join(''):empty('Здесь появятся ваши постройки.','village')}</div>`:`<div class="card">${empty('Посёлок ещё не создан. Опишите его в боте — и появится настоящая карта.','village')}${btn('Создать в боте','bot','village','wide primary')}</div>`)}
function giveaways(){const list=state.data.giveaways;return heading('Розыгрыши','gift')+`<div class="card">${list.length?list.map(g=>`<div class="row"><span class="event-mark">${icon('gift')}</span><div class="row-body"><strong>Розыгрыш #${g.id}</strong><small>${esc(g.prize)}<br>${g.winners} победителей · до ${fmtDate(g.ends)}</small></div></div>`).join(''):empty('Активных розыгрышей пока нет.','gift')}</div>${btn(manager()?'Создать в боте':'Меню группы в боте','bot','giveaway','wide primary')}`}
const eventLabels={mode:'Изменён режим модерации',rules:'Обновлены правила',spam_enabled:'Изменена защита от спама',delete_notifications:'Изменены уведомления',ai_chat_prompt:'Обновлён промпт помощника',ai_chat_source:'Изменена модель ИИ',enabled:'Изменён статус бота',flood_enabled:'Изменена защита от флуда',moderation_enabled:'Изменена модерация',ai_moderation_enabled:'Изменена ИИ-модерация'};
function events(){return heading('События','calendar')+`<div class="caption" style="margin-bottom:15px">Последние изменения настроек группы</div><div class="card">${state.data.events.length?state.data.events.map(e=>`<div class="row"><span class="event-mark">${icon('calendar')}</span><div class="row-body"><strong>${esc(eventLabels[e.event]||'Изменение настроек')}</strong><small>${fmtDate(e.created)}</small></div></div>`).join(''):empty(manager()?'Изменений пока нет.':'Журнал доступен управляющим.','calendar')}</div>`}
function profile(){const u=state.user;return heading('Профиль','user')+`<div class="profile-head"><div class="profile-avatar" data-avatar="/me/avatar" data-fallback="${esc(Array.from(u.first_name||'G')[0])}">${esc(Array.from(u.first_name||'G')[0])}</div><div><h2 style="font-size:22px">${esc([u.first_name,u.last_name].filter(Boolean).join(' '))}</h2><div class="caption">${u.username?'@'+esc(u.username):'Аккаунт Telegram'}</div></div></div><div class="card"><div class="row"><div class="row-body"><strong>Ваша роль в группе</strong><small>${esc(role(state.data.group.role))}</small></div>${icon('shield')}</div><div class="row"><div class="row-body"><strong>Тариф группы</strong><small>${esc(tier(state.data.group))}</small></div>${btn('Подробнее','bot','access')}</div><button class="row" data-action="releases"><div class="row-body"><strong>О боте и изменения</strong><small>Golka GTB ${esc(state.data.version)}</small></div><span>›</span></button><button class="row" data-action="rules"><div class="row-body"><strong>Правила группы</strong><small>Информация для участников</small></div><span>›</span></button></div>${btn('Рекламный кабинет в боте','bot','ads','wide secondary')}<div class="connected-label">Сделано для ваших сообществ.</div>`}
function render(){if(!state.data)return;const views={home,wallet,moderation,settings,ai,economy,village,giveaways,events,profile};main.innerHTML=`<div class="view">${(views[state.view]||home)()}</div>`;document.querySelectorAll('[data-view]').forEach(el=>{if(el.classList.contains('nav-item'))el.classList.toggle('active',el.dataset.view===state.view)});if(tg?.BackButton){state.history.length?tg.BackButton.show():tg.BackButton.hide()}hydrateAvatars();if(['home','village'].includes(state.view)&&vip()&&state.data.village?.has_map)loadMap()}
function navigate(view,push=true){if(view===state.view)return;if(push)state.history.push(state.view);state.view=view;haptic();render();window.scrollTo({top:0,behavior:'instant'})}
async function loadGroup(id){state.loading=true;main.innerHTML='<div class="loading"><div><div class="loader"></div>Синхронизируем группу…</div></div>';try{state.data=state.demo?makeDemo(id):await request('/groups/'+encodeURIComponent(id));state.group=id;try{localStorage.setItem('golka.selectedGroup',id)}catch{};const g=state.data.group;document.getElementById('group-title').textContent=g.title;const avatar=document.getElementById('group-avatar');avatar.dataset.avatar='/groups/'+g.id+'/avatar';avatar.dataset.fallback=Array.from(g.title)[0];avatar.textContent=avatar.dataset.fallback;delete avatar.dataset.avatarLoaded;document.getElementById('group-sub').textContent='Ваша роль: '+role(g.role);document.getElementById('group-picker').hidden=false;state.bot=state.data.bot_username||state.bot;render()}catch(e){showError(e.message)}finally{state.loading=false}}
function showError(message){main.innerHTML=`<div class="error-box">${icon('shield')}<h2>Не удалось открыть панель</h2><p>${esc(message)}</p>${btn('Попробовать снова','refresh','','primary')}</div>`}
async function save(key,value,features=false){if(state.demo){(features?state.data.features:state.data.settings)[key]=value;if(key==='ai_chat_source')state.data.ai.source=value;render();toast('Изменено в демонстрации');return}const result=await request('/groups/'+state.group+'/'+(features?'features':'settings'),{method:'POST',body:JSON.stringify({key,value,etag:state.data.etag})});state.data=result;render();toast('Настройка сохранена')}
function openBot(section){const id=state.group;const links=Object.fromEntries(['manage','moderation','aiconnections','access','shop','market','farms','wallet','transfer','investments','games','giveaway','village','ai'].map(k=>[k,'mini_'+k+'_'+id]));links.ads='adpanel';if(state.demo){toast('В Telegram здесь откроется нужный раздел бота.');return}const url='https://t.me/'+state.bot+'?start='+encodeURIComponent(id?links[section]||'mini_manage_'+id:'app');if(tg?.openTelegramLink){tg.openTelegramLink(url);tg.close?.()}else window.open(url,'_blank','noopener,noreferrer')}
const imageAssets=new Map();
async function imageAsset(path){if(state.demo)return null;const hit=imageAssets.get(path);if(hit&&Date.now()-hit.at<(path.endsWith('/map')?60000:300000))return hit.promise;if(hit?.url)URL.revokeObjectURL(hit.url);const entry={at:Date.now(),url:null,size:0};entry.promise=(async()=>{try{const response=await fetch(API_BASE+'/miniapp/v1'+path,{headers:{Authorization:'tma '+auth},signal:AbortSignal.timeout(18000),credentials:'omit',cache:'no-store'});if(!response.ok)return null;const blob=await response.blob();if(!blob.type.startsWith('image/')||blob.size>4*1024*1024)return null;entry.size=blob.size;entry.url=URL.createObjectURL(blob);return entry.url}catch{return null}})();imageAssets.delete(path);imageAssets.set(path,entry);while(imageAssets.size>12||[...imageAssets.values()].reduce((n,e)=>n+e.size,0)>8*1024*1024){const [key,old]=imageAssets.entries().next().value;if(old.url)URL.revokeObjectURL(old.url);imageAssets.delete(key)}return entry.promise}
async function paintAvatar(el){const path=el.dataset.avatar;if(el.dataset.avatarLoaded===path)return;el.dataset.avatarLoaded=path;const url=await imageAsset(path);if(!url||!el.isConnected||el.dataset.avatar!==path)return;const img=new Image();img.className='avatar-photo';img.alt='';img.src=url;img.onload=()=>{if(el.isConnected&&el.dataset.avatar===path)el.replaceChildren(img)}}
const observedAvatars=new Set();const avatarObserver=typeof IntersectionObserver!=='undefined'?new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting){avatarObserver.unobserve(entry.target);observedAvatars.delete(entry.target);paintAvatar(entry.target)}},{rootMargin:'100px'}):null;
function hydrateAvatars(){for(const el of observedAvatars)if(!el.isConnected){avatarObserver?.unobserve(el);observedAvatars.delete(el)}document.querySelectorAll('[data-avatar]').forEach(el=>{if(el.dataset.avatarLoaded===el.dataset.avatar)return;if(avatarObserver){observedAvatars.add(el);avatarObserver.observe(el)}else paintAvatar(el)})}
async function loadMap(){const containers=[...document.querySelectorAll('[data-village-map]')];if(!containers.length||!vip())return;const group=state.group;const url=await imageAsset('/groups/'+group+'/map');for(const container of containers){if(!container.isConnected||state.group!==group)continue;if(!url){container.innerHTML='<div class="map-placeholder">'+icon('village')+'<span>Карта сейчас недоступна. Попробуйте обновить страницу.</span></div>';continue}const img=new Image();img.src=url;img.alt='Карта посёлка вашей группы';if(container.id==='map-container')img.className='map-image';container.replaceChildren(img)}}
async function action(name,arg){if(name==='close-dialog')return closeDialog();if(name==='navigate')return navigate(arg);if(name==='refresh'){for(const e of imageAssets.values())if(e.url)URL.revokeObjectURL(e.url);imageAssets.clear();document.querySelectorAll('[data-avatar]').forEach(el=>delete el.dataset.avatarLoaded);if(state.group)return loadGroup(state.group);return init()}if(name==='bot')return openBot(arg);if(name==='groups'){sheet('Ваши группы','<input class="filter" id="group-search" type="search" placeholder="Найти группу" aria-label="Найти группу"><div id="group-list">'+state.groups.map(g=>`<button class="row" data-select-group="${esc(g.id)}" data-title="${esc(g.title.toLocaleLowerCase())}"><span class="group-avatar" data-avatar="/groups/${esc(g.id)}/avatar" data-fallback="${esc(Array.from(g.title)[0])}">${esc(Array.from(g.title)[0])}</span><span class="row-body"><strong>${esc(g.title)}</strong><small>${esc(tier(g))} · ${esc(role(g.role))}</small></span>${g.id===state.group?'<span style="color:var(--cyan)">✓</span>':'<span>›</span>'}</button>`).join('')+'</div>');hydrateAvatars();return}if(name==='edit'){if(!manager())return;const title=arg==='rules'?'Правила для ИИ':'Промпт помощника';sheet(title,`<form id="editor" data-key="${arg}"><label class="caption" for="editor-text">${arg==='rules'?'Текст, по которому ИИ модерирует сообщения.':'Опишите поведение и задачи помощника.'}</label><textarea id="editor-text" maxlength="4000" required>${esc(state.data.settings[arg])}</textarea><div class="caption" id="char-count">До 4000 символов</div><div class="dialog-actions">${btn('Отмена','close-dialog','','secondary')}<button class="btn primary" type="submit">Сохранить</button></div></form>`);return}if(name==='mode'){sheet('Режим ИИ Модерации',`<form id="mode-form"><label class="field-label" for="mode-select">Действия при нарушении</label><select id="mode-select">${[['dry','Тест — оставить сообщение'],['delete','Удалять нарушения'],['enforce','Удалять и применять наказания']].map(([v,t])=>`<option value="${v}" ${state.data.settings.mode===v?'selected':''}>${t}</option>`).join('')}</select><div class="note">Точные действия для каждой категории настраиваются в боте.</div><button type="submit" class="btn primary wide">Сохранить режим</button></form>`);return}if(name==='ai-model'){sheet('Модель по умолчанию',`<form id="ai-model-form"><select id="model-select">${[['off','Выключить чат с ИИ'],['flash','DeepSeek Flash'],['pro','DeepSeek Pro']].map(([v,t])=>`<option value="${v}" ${state.data.ai.source===v?'selected':''}>${t}</option>`).join('')}</select><div class="note">Своё API-подключение и GPT Luna можно выбрать в боте.</div><button type="submit" class="btn primary wide">Сохранить</button></form>`);return}if(name==='rules'){sheet('Правила группы',state.data.member_rules?`<div class="text-content">${esc(state.data.member_rules)}</div>`:empty('Правила участников пока не добавлены.','book'));return}if(name==='releases'){sheet('Версии и изменения','<div class="loading"><div class="loader"></div></div>');const releases=state.demo?[{version:'0.5.0',text:'Мини-приложение: выбор группы, настройки модерации, кошелёк, ИИ, события и посёлок.'}]:await request('/releases');document.getElementById('dialog-body').innerHTML=releases.map(r=>`<div class="version-block"><h3>${esc(r.version)}</h3><p>${esc(r.text)}</p></div>`).join('');return}}
document.addEventListener('click',async e=>{const el=e.target.closest('button');if(!el||el.disabled)return;try{if(el.dataset.selectGroup){closeDialog();state.history=[];state.view='home';await loadGroup(el.dataset.selectGroup)}else if(el.dataset.toggle){el.disabled=true;el.setAttribute('aria-busy','true');const features=el.dataset.feature==='1',value=el.getAttribute('aria-checked')!=='true';if(el.dataset.toggle==='moderation_enabled'&&!value&&!window.confirm('Отключить всю модерацию в этой группе?'))return;await save(el.dataset.toggle,value,features)}else if(el.dataset.daily){el.disabled=true;const kind=el.dataset.daily;if(state.demo){state.data.wallet[kind+'_remaining']=86400;if(kind==='work')state.data.wallet.coins+=24;else state.data.wallet.education+=2;render();toast('Демонстрация: '+(kind==='work'?'+24 C₲':'+2 очка обучения'));return}const result=await request('/groups/'+state.group+'/daily',{method:'POST',body:JSON.stringify({kind,request_id:crypto.randomUUID()})});state.data=result.snapshot;render();toast(kind==='work'?'Заработано '+money(result.result.salary/1000)+' C₲':'Обучение завершено')}else if(el.dataset.view)navigate(el.dataset.view);else if(el.dataset.action)await action(el.dataset.action,el.dataset.arg)}catch(error){toast(error.message)}finally{if(el.isConnected){el.disabled=false;el.removeAttribute('aria-busy')}}});
document.addEventListener('input',e=>{if(e.target.id==='group-search'){const q=e.target.value.toLocaleLowerCase();document.querySelectorAll('[data-select-group]').forEach(b=>b.hidden=!b.dataset.title.includes(q))}});
document.addEventListener('submit',async e=>{if(!['editor','mode-form','ai-model-form'].includes(e.target.id))return;e.preventDefault();const form=e.target,submit=form.querySelector('[type=submit]');submit.disabled=true;try{if(form.id==='editor')await save(form.dataset.key,document.getElementById('editor-text').value);else if(form.id==='mode-form')await save('mode',document.getElementById('mode-select').value);else await save('ai_chat_source',document.getElementById('model-select').value);closeDialog()}catch(error){toast(error.message)}finally{submit.disabled=false}});
function makeDemo(id){const g=state.groups.find(g=>g.id===id)||state.groups[0];return {version:'0.5.0',bot_username:FALLBACK_BOT,group:g,etag:'demo',stats:{checked:248,removed:7,members:126},settings:{moderation_enabled:true,ai_moderation_enabled:true,spam_enabled:true,flood_enabled:true,delete_notifications:false,ai_chat_search:true,mode:'delete',rules:'Запрещены угрозы, травля, мошенничество и реклама. Обычное общение разрешено.',ai_chat_prompt:'Помогай участникам группы. Отвечай кратко и дружелюбно.',ai_chat_source:'flash'},features:Object.fromEntries(Object.keys(FEATURE_LABELS).map(k=>[k,true])),wallet:{energy:42,coins:12840,education:72,level:8,xp:2480,level_start:2450,next_xp:3000,rebirths:0,work_remaining:0,study_remaining:0},ai:{remaining_percent:76,active:true,source:'flash'},village:{level:3,xp:780,level_start:500,next_xp:900,available:1,has_map:false,description:'Посёлок у реки, рядом дубы и сакуры. Место, которое мы строим вместе.',buildings:[{name:'Ратуша',level:2},{name:'Мастерская',level:1}]},member_rules:'Уважайте друг друга. Не публикуйте рекламу и не отправляйте спам.',events:[{event:'rules',created:Date.now()/1000-420},{event:'spam_enabled',created:Date.now()/1000-3600},{event:'mode',created:Date.now()/1000-7200}],farms:[],giveaways:[]}}
async function init(){try{if(state.demo){document.getElementById('demo-banner').hidden=false;state.user={id:1,first_name:'Гость',last_name:'',username:'preview'};state.groups=[{id:'-1001',title:'Солотащера чат',paid:true,tier:'vip',role:'manager',enabled:true},{id:'-1002',title:'GolkaGTB Testing',paid:false,tier:'free',role:'owner',enabled:true}]}else{const me=await request('/me');state.user=me.user;state.groups=me.groups;state.bot=me.bot_username||FALLBACK_BOT}if(!state.groups.length){main.innerHTML=empty('Пока нет доступных групп. Подключите группу в боте или попросите владельца назначить вас управляющим.','users')+btn('Открыть бота','bot','manage','wide primary');return}let saved;try{saved=localStorage.getItem('golka.selectedGroup')}catch{}await loadGroup(state.groups.some(g=>g.id===saved)?saved:state.groups[0].id)}catch(error){showError(error.message)}}
try{tg?.ready();tg?.expand();tg?.setHeaderColor('#0a111e');tg?.setBackgroundColor('#0a111e');tg?.BackButton?.onClick(()=>{if(state.history.length){state.view=state.history.pop();render()}})}catch{}
init();
</script>
