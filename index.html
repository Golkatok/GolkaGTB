async function request(path,options={}){
 if(!API_BASE||API_BASE==='__API_BASE__')throw new Error('Сервер ещё не подключён. Обратитесь к владельцу бота.');
 const response=await fetch(API_BASE.replace(/\/$/,'')+'/miniapp/v1'+path,{...options,headers:{'Authorization':'tma '+auth,...(options.body?{'Content-Type':'application/json'}:{}),...options.headers},signal:AbortSignal.timeout(18000),credentials:'omit',cache:'no-store'});
 if(!response.ok){let error;try{error=await response.json()}catch{}throw new Error(error?.retry_after?'Следующая попытка через '+duration(error.retry_after):error?.error||'Сервер недоступен. Попробуйте позже.')}
 return response.json();
}

const imageAssets=new Map();
async function imageAsset(path){if(state.demo)return null;const hit=imageAssets.get(path);if(hit&&Date.now()-hit.at<(path.endsWith('/map')?60000:300000))return hit.promise;if(hit?.url)URL.revokeObjectURL(hit.url);const entry={at:Date.now(),url:null,size:0};entry.promise=(async()=>{try{const response=await fetch(API_BASE+'/miniapp/v1'+path,{headers:{Authorization:'tma '+auth},signal:AbortSignal.timeout(18000),credentials:'omit',cache:'no-store'});if(!response.ok)return null;const blob=await response.blob();if(!blob.type.startsWith('image/')||blob.size>4*1024*1024)return null;entry.size=blob.size;entry.url=URL.createObjectURL(blob);return entry.url}catch{return null}})();imageAssets.delete(path);imageAssets.set(path,entry);while(imageAssets.size>12||[...imageAssets.values()].reduce((n,e)=>n+e.size,0)>8*1024*1024){const [key,old]=imageAssets.entries().next().value;if(old.url)URL.revokeObjectURL(old.url);imageAssets.delete(key)}return entry.promise}
async function paintAvatar(el){const path=el.dataset.avatar;if(el.dataset.avatarLoaded===path)return;el.dataset.avatarLoaded=path;const url=await imageAsset(path);if(!url||!el.isConnected||el.dataset.avatar!==path)return;const img=new Image();img.className='avatar-photo';img.alt='';img.src=url;img.onload=()=>{if(el.isConnected&&el.dataset.avatar===path)el.replaceChildren(img)}}
const observedAvatars=new Set();const avatarObserver=typeof IntersectionObserver!=='undefined'?new IntersectionObserver(entries=>{for(const entry of entries)if(entry.isIntersecting){avatarObserver.unobserve(entry.target);observedAvatars.delete(entry.target);paintAvatar(entry.target)}},{rootMargin:'100px'}):null;
function hydrateAvatars(){for(const el of observedAvatars)if(!el.isConnected){avatarObserver?.unobserve(el);observedAvatars.delete(el)}document.querySelectorAll('[data-avatar]').forEach(el=>{if(el.dataset.avatarLoaded===el.dataset.avatar)return;if(avatarObserver){observedAvatars.add(el);avatarObserver.observe(el)}else paintAvatar(el)})}
async function loadMap(){const containers=[...document.querySelectorAll('[data-village-map]')];if(!containers.length||!vip())return;const group=state.group;const url=await imageAsset('/groups/'+group+'/map');for(const container of containers){if(!container.isConnected||state.group!==group)continue;if(!url){container.innerHTML='<div class="map-placeholder">'+icon('village')+'<span>Карта сейчас недоступна. Попробуйте обновить страницу.</span></div>';continue}const img=new Image();img.src=url;img.alt='Карта посёлка вашей группы';if(container.id==='map-container')img.className='map-image';container.replaceChildren(img)}}

async function loadWalletHistory(){const asset=state.currency,group=state.group;if(state.walletHistory[asset]||historyBusy)return;historyBusy=true;try{const result=state.demo?{items:[{id:3,title:'Работа',amount:82,asset,created:Date.now()/1000-300},{id:2,title:'Покупка фермы',amount:-1200,asset,created:Date.now()/1000-3000},{id:1,title:'Перевод',amount:500,asset,created:Date.now()/1000-86000}],next:null}:await request('/groups/'+group+'/history',{method:'POST',body:JSON.stringify({asset})});if(state.group!==group)return;state.walletHistory[asset]=result;if(state.view==='wallet'&&state.currency===asset)paintWalletHistory()}catch(error){if(state.group===group)toast(error.message)}finally{historyBusy=false;if(state.view==='wallet'&&!state.walletHistory[state.currency]&&state.currency!==asset)loadWalletHistory()}}

function panelText(text,entities=[]){const safe=new Set(['bold','italic','underline','strikethrough','code','pre','spoiler']);const tags={bold:'b',italic:'i',underline:'u',strikethrough:'s',code:'code',pre:'pre',spoiler:'span'};const points=new Map();for(const e of entities){if(!safe.has(e.type)||!Number.isInteger(e.offset)||!Number.isInteger(e.length)||e.offset<0||e.length<=0||e.offset+e.length>text.length)continue;const end=e.offset+e.length;if(!points.has(e.offset))points.set(e.offset,[]);if(!points.has(end))points.set(end,[]);points.get(e.offset).push({tag:tags[e.type],start:true,end});points.get(end).push({tag:tags[e.type],start:false,end:e.offset})}let result='';for(let i=0;i<=text.length;i++){const events=points.get(i)||[];for(const e of events.filter(e=>!e.start).sort((a,b)=>b.end-a.end))result+='</'+e.tag+'>';for(const e of events.filter(e=>e.start).sort((a,b)=>b.end-a.end))result+='<'+e.tag+'>';if(i<text.length)result+=esc(text[i])}return result}

function shopView(p){state.panel=p;const page=p.page||{},currency=page.asset,buttons=p.buttons.flat(),isRoot=page.kind==='shop',isCategory=page.kind==='shopcurrency';const tabs=`<div class="store-tabs" aria-label="Валюта магазина">${[['stars','За ⭐'],['energy','За ⚡'],['coins','За C₲']].map(([a,t])=>`<button data-action="store-currency" data-arg="${a}" aria-pressed="${a===currency}">${t}</button>`).join('')}</div>`;const balance=currency==='coins'?money(state.data.wallet.coins)+' C₲':currency==='energy'?money(state.data.wallet.energy)+' ⚡':'';let content='';if(isRoot||isCategory){content=(isRoot?'<p class="commerce-caption">Выберите, чем хотите оплатить покупку.</p>':'')+`<div class="store-grid">${buttons.map(b=>{let data=STORE_KINDS[b.kind];if(b.kind==='shopcurrency')data=[{stars:'За звёзды',energy:'За молнии',coins:'За монеты'}[b.asset],b.asset==='stars'?'Покупка ⚡ и поддержка проекта':'Покупки с вашего баланса',b.asset==='energy'?'bolt':'wallet'];if(b.kind==='aisub')data=b.product==='ds_pack'?['Проверки модерации','DeepSeek · 1 000 сообщений','shield']:[b.product==='gpt_month'?'GPT Luna':'DeepSeek','Чат с ИИ для группы','ai'];const [title,desc,i]=data||[b.label,'Открыть','arrow'];return `<button class="store-tile" ${b.token?`data-action="panel-step" data-arg="${esc(b.token)}"`:`data-action="panel-url" data-arg="${esc(b.url)}"`}>${icon(i)}<strong>${esc(title)}</strong><small>${esc(desc)}</small></button>`}).join('')}</div>`;if(!buttons.length)content=`<div class="store-page-text">${esc(p.text)}</div>`}else{const items=buttons.filter(b=>b.item),other=buttons.filter(b=>!b.item);content=(items.length>6?'<input id="store-search" type="search" placeholder="Найти товар" aria-label="Найти товар">':'')+(items.length?`<div class="store-items">${items.map(b=>`<button class="store-item" data-title="${esc(b.item.name.toLocaleLowerCase())}" data-action="panel-step" data-arg="${esc(b.token)}">${icon(b.kind==='farm'?'village':'gift')}<span class="row-body"><strong>${esc(b.item.name)}</strong><small>${esc(b.item.detail)}</small></span><span>${money(b.item.price)} ${assetSymbol(b.item.asset)}</span></button>`).join('')}</div>`:`<div class="store-page-text">${panelText(p.text,p.entities)}</div>`)+`<div class="panel-buttons">${other.map(b=>btn(b.label,b.token?'panel-step':'panel-url',b.token||b.url,'secondary wide')).join('')}</div>`}sheet('Магазин',tabs+(balance?`<div class="store-balance">Ваш баланс: ${balance}</div>`:'')+content+`<div class="store-footer">${p.back?btn('Назад','panel-step',p.back,'secondary'):''}${btn('Закрыть','close-dialog','','secondary')}</div>`)}
document.addEventListener('click',e=>{const asset=e.target.closest('[data-transfer-asset]');if(asset){const form=document.getElementById('commerce-form'),value=asset.dataset.transferAsset;form.elements.asset.value=value;form.querySelectorAll('[data-transfer-asset]').forEach(b=>b.setAttribute('aria-pressed',String(b===asset)));document.getElementById('commerce-symbol').textContent=assetSymbol(value);document.getElementById('transfer-balance').textContent=document.getElementById('transfer-balance').dataset.source+': '+money(state.panel.form.balances?.[value]??state.data.wallet[value==='energy'?'energy':'coins'])+' '+assetSymbol(value)}const portion=e.target.closest('[data-portion]');if(portion)document.getElementById('commerce-amount').value=portion.dataset.portion});

document.addEventListener('submit',async e=>{if(e.target.id!=='commerce-form')return;e.preventDefault();const form=e.target,button=form.querySelector('[type=submit]'),kind=form.dataset.kind;const d=Object.fromEntries(new FormData(form));for(const k in d)d[k]=d[k].trim();state.commerceDrafts??={};state.commerceDrafts[state.group+':'+kind]=d;const target=kind==='transfer'?d.recipient:(d.group==='custom'?d.target:d.group);if(!target||/[\s|]/.test(target)){toast('Укажите @username или ID без пробелов.');return}const text=kind==='transfer'?[target,d.amount,d.asset].join('\n'):target+' | '+d.amount;button.disabled=true;try{await panelStep(form.dataset.token,text)}catch(error){toast(error.message)}finally{if(button.isConnected)button.disabled=false}});

function drawDonation(p){state.panel=p;if(p.form){sheet('Поддержать проект',`<p class="commerce-caption">Добровольная поддержка развития GolkaGTB</p><form id="panel-input-form" class="commerce-form" data-token="${esc(p.form.token)}">${p.formError?`<p class="commerce-error">${esc(p.formError)}</p>`:''}<label class="field-label" for="panel-value">Сумма в звёздах</label><div class="commerce-amount"><input id="panel-value" type="number" inputmode="numeric" min="1" max="1000000" step="1" required value="100"><span>⭐</span></div><button class="btn primary wide" type="submit" style="margin-top:20px">Поддержать</button><button class="topup-cancel" type="button" data-action="close-dialog">Отмена</button></form>`);return}sheet('Поддержать проект',`<p class="commerce-caption">${esc(p.invoice?'Подтвердите поддержку в окне оплаты Telegram.':p.text.split('\n')[0])}</p>${btn('Закрыть','close-dialog','','wide secondary')}`);if(p.invoice&&tg?.openInvoice)tg.openInvoice(p.invoice,status=>{if(status==='paid'){closeDialog();toast('Спасибо за поддержку!')}})}

function openAIPreferences(){if(!manager())return;const a=state.data.ai,fields=a.preference_schema;if(!fields?.length){toast('Обновите данные приложения');return}const prefs=a.preferences||{};sheet('Настройки поведения ИИ',`<form id="ai-preferences-form" data-group="${esc(state.group)}" data-etag="${esc(state.data.etag)}"><p class="caption">Настройки действуют только в этой группе. Максимальная грубость имеет приоритет над обычными переключателями грубости. Запреты мата, тем, ссылок и языков сохраняются.</p>${fields.map(f=>`<label class="field-label" for="pref-${esc(f.key)}">${esc(f.label)}</label>${f.options?`<select id="pref-${esc(f.key)}" name="${esc(f.key)}">${f.options.map(o=>`<option value="${esc(o.value)}" ${prefs[f.key]===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}</select>`:`<textarea id="pref-${esc(f.key)}" name="${esc(f.key)}" rows="${f.key==='languages'?2:3}" maxlength="${f.limit*(f.width+2)}" placeholder="${f.key==='languages'?'Например: русский, английский':'По одной теме на строку'}">${esc((prefs[f.key]||[]).join('\n'))}</textarea><p class="caption">${f.key==='languages'?'Пусто — любые языки. До 10 языков.':'Пусто — нет запрещённых тем. До 20 тем.'} Можно разделять запятыми или новыми строками.</p>`}`).join('')}<p class="caption">Настройки тем не отключают ограничения модели.</p><div class="dialog-actions"><button class="btn secondary" type="button" data-action="close-dialog">Отмена</button><button class="btn primary" type="submit">Сохранить</button></div><p id="ai-pref-error" class="commerce-error" role="alert" hidden></p></form>`)}
document.addEventListener('submit',async e=>{if(e.target.id!=='ai-preferences-form')return;e.preventDefault();const form=e.target,button=form.querySelector('[type=submit]'),fields=state.data.ai.preference_schema,preferences={};button.disabled=true;try{for(const f of fields){const value=form.elements.namedItem(f.key).value;preferences[f.key]=f.options?value:value.split(/[,;\n]+/).map(v=>v.trim()).filter(Boolean)}if(state.group!==form.dataset.group)throw Error('Группа изменилась. Откройте настройки заново.');if(state.demo){state.data.ai.preferences=preferences}else state.data=await request('/groups/'+form.dataset.group+'/ai-preferences',{method:'POST',body:JSON.stringify({etag:form.dataset.etag,preferences})});render();closeDialog();toast('Настройки ИИ сохранены')}catch(error){const area=document.getElementById('ai-pref-error');if(area){area.hidden=false;area.textContent=error.message}else toast(error.message)}finally{button.disabled=false}});
async function openGuide(category){sheet('Руководство','<div class="loading"><div class="loader"></div></div>');try{if(category){const d=await request('/guide/'+encodeURIComponent(category));sheet(d.title,`<div class="panel-body">${panelText(d.formatted_text||d.text,d.entities||[])}</div><div class="dialog-actions">${btn('Все разделы','guide-index','','secondary')}${btn('Закрыть','close-dialog','','secondary')}</div>`)}else{const list=await request('/guide');sheet('Руководство по боту',`<input id="manual-search" type="search" placeholder="Найти раздел" aria-label="Найти раздел">${list.map(c=>`<button class="row" data-guide-title="${esc((c.title+' '+c.description).toLocaleLowerCase())}" data-action="guide-category" data-arg="${esc(c.category)}"><span class="row-body"><strong>${esc(c.title)}</strong><small>${esc(c.description)}</small></span><span>›</span></button>`).join('')}`)}}catch(error){sheet('Руководство',empty(error.message)+btn('Закрыть','close-dialog','','wide secondary'))}}

function drawPanel(p){if(p.form?.kind==='stars_donation')p.section='donate';if(p.section==='donate')return drawDonation(p);if(p.receipt)return commerceReceipt(p);if(p.checkout)return commerceCheckout(p);if(p.form&&['transfer','exchange'].includes(p.form.kind))return commerceForm(p,p.form.kind);if(p.form?.kind==='energy_topup')p.section='topup';if(p.section==='topup')return drawTopup(p);if(p.section==='shop'&&!p.form)return shopView(p);state.panel=p;sheet('Управление',`<div class="panel-body">${panelText(p.text,p.entities)}</div>${p.map&&vip()?'<div data-village-map id="map-container"></div>':''}<div class="panel-buttons">${p.buttons.map(row=>`<div class="panel-button-row">${row.map(b=>b.token?btn(b.label,'panel-step',b.token,'secondary'):`<button class="btn secondary" data-action="panel-url" data-arg="${esc(b.url)}">${esc(b.label)}</button>`).join('')}</div>`).join('')}</div>${p.form?`<form class="panel-form" id="panel-input-form" data-token="${esc(p.form.token)}"><label class="field-label" for="panel-value">${esc(p.form.label)}</label>${p.form.secret?'<input id="panel-value" type="password" autocomplete="new-password" autocapitalize="off" spellcheck="false" maxlength="8000" required>':'<textarea id="panel-value" maxlength="8000" required placeholder="Введите ответ"></textarea>'}<button class="btn primary wide" type="submit">Продолжить</button></form>`:''}<div class="dialog-actions">${p.back?btn('Назад','panel-step',p.back,'secondary'):''}${btn('Закрыть','close-dialog','','secondary')}</div>`);if(p.map)loadMap();if(p.invoice){if(tg?.openInvoice)tg.openInvoice(p.invoice,()=>refreshAfterPanel());else toast('Оплата доступна внутри Telegram.')}}
async function openPanel(section){if(!state.group)return;closeDialog();if(state.demo){sheet('Демонстрация',empty('Этот раздел работает с настоящими данными при открытии через Telegram.')+btn('Закрыть','close-dialog','','wide'));return}const group=state.group;sheet('Загрузка','<div class="loading"><div class="loader"></div></div>');try{const p=await request('/groups/'+group+'/panel',{method:'POST',body:JSON.stringify({section})});if(state.group===group)drawPanel({...p,section:section.startsWith('shop_')?'shop':section})}catch(error){closeDialog();throw error}}
async function refreshAfterPanel(){const group=state.group;try{const d=await request('/groups/'+group);if(state.group!==group)return;state.data=d;state.walletHistory={};render()}catch(error){toast(error.message)}}
let panelBusy=false;
async function panelStep(token,text){if(!state.panel||panelBusy)return;panelBusy=true;try{const group=state.group,session=state.panel.session,section=state.panel.section;if(section==='topup'&&text!==undefined)state.topupAmount=text;const p=await request('/groups/'+group+'/panel',{method:'POST',body:JSON.stringify({session,token,...(text===undefined?{}:{text})})});if(state.group!==group)return;drawPanel({...p,section,...(section==='donate'&&text!==undefined&&p.form?{formError:p.text.split('\n')[0]}:{}),...(text!==undefined&&p.form&&['transfer','exchange'].includes(p.form.kind)?{commerceError:p.text.split('\n')[0]}:{}),...(section==='topup'&&text!==undefined&&p.form?{topupError:p.text.split('\n')[0]}:{})});await refreshAfterPanel()}finally{panelBusy=false}}
document.addEventListener('submit',async e=>{if(e.target.id!=='panel-input-form')return;e.preventDefault();const form=e.target,button=form.querySelector('[type=submit]'),input=form.querySelector('textarea,input');button.disabled=true;try{const value=input.value;if(state.panel?.section==='topup'&&!topupPrice(value).valid){updateTopupPrice();return}if(state.panel?.section!=='topup')input.value='';await panelStep(form.dataset.token,value)}catch(error){toast(error.message)}finally{if(button.isConnected)button.disabled=state.panel?.section==='topup'?!topupPrice(input.value).valid:false}});
